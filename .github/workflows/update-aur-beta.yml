name: Update AUR beta package

on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Push current beta packaging tree to AUR even if version did not change"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [synara-beta-release]

permissions:
  contents: write

concurrency:
  group: aur-synara-beta-update
  cancel-in-progress: false

jobs:
  update:
    name: Sync upstream beta release to AUR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect / apply upstream beta update
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: Emanuele-web04/synara
        run: |
          chmod +x scripts/update-beta-from-upstream.sh
          scripts/update-beta-from-upstream.sh
          if ! grep -q '^version=' "$GITHUB_OUTPUT"; then
            echo "version=$(sed -n 's/^pkgver=//p' beta/PKGBUILD | head -n1)" >> "$GITHUB_OUTPUT"
          fi
          echo "force_publish=${{ inputs.force_publish || false }}" >> "$GITHUB_OUTPUT"

      # A failed publish used to be permanent for the stable package: the commit
      # runs first, so later runs saw "already at <version>" and skipped the AUR
      # push forever. Compare against the live AUR version and republish while
      # it lags.
      - name: Check whether AUR is behind
        id: aurstate
        run: |
          local_ver="$(sed -n 's/^pkgver=//p' beta/PKGBUILD | head -n1)"
          aur_ver="$(curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=synara-beta' \
            | jq -r '.results[0].Version // ""' | cut -d- -f1)"
          echo "local=$local_ver aur=${aur_ver:-<none>}"
          if [[ -n "$local_ver" && "$local_ver" != "$aur_ver" ]]; then
            echo "publish_needed=true" >>"$GITHUB_OUTPUT"
          else
            echo "publish_needed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Regenerate .SRCINFO
        if: steps.sync.outputs.updated == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/pkg" \
            -w /pkg/beta \
            archlinux:latest bash -lc '
              pacman -Sy --noconfirm base-devel >/dev/null
              HOST_UID='"$(id -u)"'
              HOST_GID='"$(id -g)"'
              groupadd -g "$HOST_GID" builder
              useradd -u "$HOST_UID" -g "$HOST_GID" -m builder
              chown "$HOST_UID:$HOST_GID" /pkg /pkg/beta
              su builder -c "makepkg --printsrcinfo > /pkg/beta/.SRCINFO"
            '

      - name: Commit packaging repo changes
        if: steps.sync.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta/PKGBUILD beta/.SRCINFO beta/LICENSE
          git commit -m "upgpkg: synara-beta ${{ steps.sync.outputs.version }}"
          git push

      - name: Publish to AUR
        if: steps.sync.outputs.updated == 'true' || steps.aurstate.outputs.publish_needed == 'true' || steps.sync.outputs.force_publish == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY secret is missing; packaging repo was updated but AUR was not pushed." >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # The synara-beta AUR repo is created by its first push, so a clone
          # fails until then. Fall back to a fresh repo for that first import.
          if git clone "ssh://aur@aur.archlinux.org/synara-beta.git" /tmp/aur-synara-beta 2>/dev/null; then
            :
          else
            rm -rf /tmp/aur-synara-beta
            git init -q /tmp/aur-synara-beta
            git -C /tmp/aur-synara-beta remote add origin "ssh://aur@aur.archlinux.org/synara-beta.git"
          fi

          rsync -a --delete \
            --exclude '.git' \
            beta/ /tmp/aur-synara-beta/

          cd /tmp/aur-synara-beta
          version="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)"
          git config user.name "${AUR_GIT_NAME:-horizzon3507}"
          git config user.email "${AUR_GIT_EMAIL:-148660626+horizzon3507@users.noreply.github.com}"
          git add -A .
          if git diff --cached --quiet; then
            echo "AUR tree already up to date."
            exit 0
          fi
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit -m "upgpkg: synara-beta ${version}"
          else
            git commit -m "Initial import: synara-beta ${version}"
          fi
          git push
